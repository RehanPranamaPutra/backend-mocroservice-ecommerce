services:
  product-service:
    build: ./product-service
    ports: 
      - "${PRODUCT_SERVICE_PORT}:3000"
    env_file:
      - .env
    environment:
      DB_HOST: ${PRODUCT_DB_HOST}
      DB_NAME: ${PRODUCT_DB_NAME}
      DB_USER: ${PRODUCT_DB_USER}
      DB_PASSWORD: ${PRODUCT_DB_PASSWORD}
    container_name: product-services
    restart: always
    depends_on:
      product-db :
        condition: service_healthy
  
  product-db:
    image: mysql:latest
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD : ${PRODUCT_DB_PASSWORD}
      MYSQL_DATABASE : ${PRODUCT_DB_NAME}
    volumes:
      - product-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  # cart-service:
  #   build: ./cart-service
  #   ports:
  #     - "8000:8000"
  #   container_name: cart-services
  #   restart: always

  review-service:
    build: ./review-service
    ports:
      - "5002:5002"
    container_name: review-services
    restart: always
    env_file:
      - .env
    depends_on:
      - mongo-db
    environment:
      MONGO_URI: mongodb://admin:admin123@mongo-db:27017/reviewdb?authSource=admin

  mongo-db:
    image: mongo:latest
    container_name: mongo-db
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME}
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - mongo-db:/data/db
    restart: always
  
  mongo-express:
    image: mongo-express:1.0.2
    container_name: mongo-express
    env_file:
      - .env
    environment:
      ME_CONFIG_BASICAUTH: "true"
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongo-db:27017/?authSource=admin
    ports:
      - "${MONGO_EXPRESS_PORT}:8081"
    restart: always
    depends_on:
      - mongo-db
  
  user-service:
    build: ./user-service
    container_name: user-service
    ports:
      - "4000:4000"
    environment:
      - DB_HOST=user-db
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - PORT=4000
    depends_on:
      user-db :
        condition: service_healthy

  user-db:
    image: postgres:15-alpine
    container_name: user-db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    restart: always
    volumes:
     - user-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  cart-db:
    image: redis:alpine
    container_name: cart-db
    restart: always
    ports:
      - "6379:6379"

  cart-service:
    build: ./cart-service
    container_name: cart-service
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=cart-db
    depends_on:
      - cart-db
    volumes:
      - ./cart-service:/app
      - /app/vendor # <--- TAMBAHKAN INI. Ini memberitahu Docker: "Jangan timpa folder vendor ini dengan yang ada di laptop"

  # ==========================================================
  # --- VIEWER AREA (AKSES DATABASE LEWAT BROWSER) ---
  # ==========================================================

  # 1. ADMINER (Untuk Lihat MySQL & Postgres)
  adminer:
    image: adminer
    container_name: database-viewer
    restart: always
    ports:
      - "8080:8080" 
  
  # 3. REDIS INSIGHT 
  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis-viewer
    restart: always
    ports:
      - "5540:5540"

volumes:
    product-db-data:
    mongo-db:
    user-db-data:


      
